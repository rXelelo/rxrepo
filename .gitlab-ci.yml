image: archlinux:latest

stages:
  - build

build_job:
  stage: build
  script:
    - pacman-key --init
    - pacman-key --populate
    - pacman -Sy archlinux-keyring
    - gpg --recv-keys 102286012EAFCB1E
    - pacman-key --recv-keys 102286012EAFCB1E
    - pacman-key --init
    - pacman-key --populate
    - cd ./rxrepo/os/x86_64
    - ls
    - chmod +x update_repo.sh
    - ./update_repo.sh

