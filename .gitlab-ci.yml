image: archlinux:latest

stages:
  - build

build_job:
  stage: build
  script:
    - gpg --recv-keys 102286012EAFCB1E
    - pacman-key --recv-keys 102286012EAFCB1E
    - pacman-key --finger 102286012EAFCB1E
    - pacman-key --lsign-key 102286012EAFCB1E
    - pacman-key --init
    - pacman-key --populate
    - chmod +x update_repo.sh
    - ./update_repo.sh

